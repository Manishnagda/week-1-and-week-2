<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🌿 Plant Disease Detector (CNN + Streamlit)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🌿 Plant Disease Detector (CNN + Streamlit)</h1>
    <p class="subtitle">AI-powered leaf disease classification using deep learning and Streamlit UI</p>
  </header>
  <main>
    <section>
      <h2>Overview</h2>
      <p>
        AI-powered plant disease detection system using CNN to classify leaf images as healthy or diseased.
        Fast, real-time predictions in a user-friendly web interface. Built for researchers, farmers, and crop specialists!
      </p>
    </section>
    <section>
      <h2>Dataset</h2>
      <p>
        Trained on <a href="https://www.kaggle.com/datasets/emmarex/plantdisease" target="_blank">PlantVillage</a> dataset.<br>
        <strong>Classes:</strong> Healthy, Early Blight, Late Blight, Bacterial Spot.<br>
        <em>Note: Dataset is excluded from this repo due to size. Please download separately if needed.</em>
      </p>
    </section>
    <section>
      <h2>How It Works</h2>
      <ul>
        <li>CNN architecture: 4 Conv2D layers (32, 64, 128, 128 filters), MaxPooling, Dropout, Dense (softmax output)</li>
        <li>Input: 128x128 RGB images</li>
        <li>Tech: TensorFlow/Keras, Streamlit, NumPy, Pandas, PIL/Pillow</li>
        <li>Supports data augmentation, comprehensive evaluation metrics</li>
      </ul>
    </section>
    <section>
      <h2>How to Run</h2>
      <pre>
git clone https://github.com/Manishnagda/week-1-and-week-2.git
pip install -r requirements.txt
streamlit run app.py
      </pre>
    </section>
    <section>
      <h2>Results / Screenshots</h2>
      <p>
        See results live in Streamlit after following above steps.<br>
        <em>Add your output images or screenshots to <code>/docs/assets/</code> to show here.</em>
      </p>
    </section>
    <section>
      <h2>Contact</h2>
      <p>
        <a href="https://github.com/Manishnagda/week-1-and-week-2" target="_blank">GitHub Repo</a>
        &nbsp;|&nbsp;
        <a href="https://github.com/Manishnagda" target="_blank">Manishnagda's Profile</a>
      </p>
    </section>
  </main>
  <footer>
    <p>© 2024 Plant Disease Detector | Shell-Edunet Skills4Future Internship</p>
  </footer>
</body>
</html>
